# Gerado manualmente — ajuste "app" depois de rodar `fly launch` (ele confirma
# se o nome está disponível no Fly.io e pode reescrever este arquivo).
app = "checkupseguro"
primary_region = "gru"  # São Paulo

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
