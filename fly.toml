# fly.toml app configuration file generated for checkupseguro on 2026-09-23T00:55:36-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'checkupseguro'
primary_region = 'gru'

[build]

[env]
  DATABASE_PATH = '/data/checkup.db'
  APP_BASE_URL = 'https://checkupseguro.fly.dev'

# Banco SQLite das contas e do monitoramento. Crie o volume antes do primeiro
# deploy:  fly volumes create checkup_data --region gru --size 1
# Com volume, o app roda em 1 máquina só (o SQLite não é compartilhado).
[mounts]
  source = 'checkup_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
